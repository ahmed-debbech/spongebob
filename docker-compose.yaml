services:

  rabbitmq:
    image: rabbitmq:4.1.6-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - spongebob-net
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 5s
      timeout: 5s
      retries: 5

  main:
    build: ./main
    image: spongebob_main:latest
    container_name: main
    volumes:
      - ./mp3:/app/mp3 #modify Config.java with path in container
      - ./output:/app/output #modify Config.java with path in container
    networks:
      - spongebob-net
    depends_on:
      rabbitmq:
        condition: service_healthy

  uploader:
    build: ./uploader
    image: spongebob_uploader:latest
    container_name: uploader
    networks:
      - spongebob-net
    depends_on:
      rabbitmq:
        condition: service_healthy
      
  
networks:
  spongebob-net:
    driver: bridge

