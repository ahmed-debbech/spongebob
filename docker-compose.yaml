services:

  dash:
    build: ./dash
    image: spongebob_dash:latest
    container_name: dash
    networks:
      - spongebob-net
    environment:
      - GOOGLE_REDIRECT_URI=http://localhost:3600
    ports:
      - 3600:3600
    volumes:
      - ./scdownloads:/app/scdownloads
    depends_on:
      - scdown
  
  scdown:
    build: ./scdown
    image: spongebob_scdown:latest
    container_name: scdown
    networks:
      - spongebob-net
    volumes:
      - ./scdownloads:/app/scdownloads
      - ./download_internal:/app/download_internal
    ports:
      - 20001:20001 


  database:
    image: redis:7.4-alpine
    restart: always
    command: redis-server --save 20 1 --loglevel warning
    ports:
      - 6379:6379
    networks:
      - spongebob-net
    volumes:
      - ./redis_data:/data

networks:
  spongebob-net:
    driver: bridge

