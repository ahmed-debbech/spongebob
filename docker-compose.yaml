services:

  dash:
    build: ./dash
    image: spongebob_dash:latest
    container_name: dash
    networks:
      - spongebob-net
    environment:
      - GOOGLE_REDIRECT_URI=http://localhost:3600
    ports:
      - 3600:3600
    volumes:
      - ./scdownloads:/app/scdownloads
    depends_on:
      - scdown
  
  scdown:
    build: ./scdown
    image: spongebob_scdown:latest
    container_name: scdown
    networks:
      - spongebob-net
    volumes:
      - ./scdownloads:/app/scdownloads
      - ./download_internal:/app/download_internal
    ports:
      - 20001:20001 


  main:
    build: ./main
    image: spongebob_main:latest
    container_name: main
    volumes:
      - ./download_internal:/app/download_internal #modify Config.java with path in container
      - ./output:/app/output #modify Config.java with path in container
    networks:
      - spongebob-net
    depends_on:
      rabbitmq:
        condition: service_healthy

  rabbitmq:
    image: rabbitmq:4.1.6-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - spongebob-net
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 5s
      timeout: 5s
      retries: 5

  database:
    image: redis:7.4-alpine
    restart: always
    command: redis-server --save 20 1 --loglevel warning
    ports:
      - 6379:6379
    networks:
      - spongebob-net
    volumes:
      - ./redis_data:/data

  uploader:
    build: ./uploader
    image: spongebob_uploader:latest
    container_name: uploader
    networks:
      - spongebob-net
    volumes:
        - ./output:/app/vids #modify Config.java with path in container
    depends_on:
      rabbitmq:
        condition: service_healthy

networks:
  spongebob-net:
    driver: bridge

